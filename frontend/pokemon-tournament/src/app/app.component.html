<div class="container">
  
  <div class="row">
    <span>Tournament Statistics</span>
    <h3>Pokemon League</h3>
    <span>Explore performance statistics from the latest pokemon tournament. Sort by different metrics to see who's leading the competition!</span>
  </div>

  <div class="row">
    <mat-card appearance="outlined">
      <mat-card-content>
        <mat-form-field>
          <mat-label>Sort By</mat-label>
          <mat-select [formControl]="sortByControl">
            <mat-option value="wins">Wins</mat-option>            
            <mat-option value="losses">Losses</mat-option> 
            <mat-option value="ties">Ties</mat-option>            
            <mat-option value="name">Name</mat-option> 
            <mat-option value="id">Id</mat-option> 
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Sort Direction</mat-label>
          <mat-select [formControl]="sortDirectionControl">
            <mat-option value="asc">Ascending</mat-option>            
            <mat-option value="desc">Descending</mat-option>            
          </mat-select>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="row">
    <app-battle-carousel [pokemonLineup]="pokemonBattleCards()"></app-battle-carousel>
  </div>
</div>
