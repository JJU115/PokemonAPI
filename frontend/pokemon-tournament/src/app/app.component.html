<div class="container">
  
  <div class="row header">
    <div class="center-item top-header-div-style" style="justify-content: center; background-color: lightblue;">
      <span>Tournament Statistics</span>
    </div>

    <h2 class="center-item" style="margin-top: 15px;">Pok&#233;mon League</h2>

    <span class="center-item" style="text-align:center">Explore performance statistics from the latest pokemon tournament. Sort by different metrics to see who's leading the competition!</span>


  </div>

  <div class="row" style="margin-bottom: 25px; margin-right: 10px; margin-left: 10px">
    <mat-card appearance="outlined" style="padding-bottom: 0px;">
      <mat-card-content style="display:flex;">
        <mat-form-field style="flex-grow: 1; margin-right: 8px;">
          <mat-label>Sort By</mat-label>
          <mat-select [formControl]="sortByControl">
            <mat-option value="wins">Wins</mat-option>            
            <mat-option value="losses">Losses</mat-option> 
            <mat-option value="ties">Ties</mat-option>            
            <mat-option value="name">Name</mat-option> 
            <mat-option value="id">Id</mat-option> 
          </mat-select>
        </mat-form-field>
        <span class="spacer"></span>
        <mat-form-field style="flex-grow: 1">
          <mat-label>Sort Direction</mat-label>
          <mat-select [formControl]="sortDirectionControl">
            <mat-option value="asc">Ascending</mat-option>            
            <mat-option value="desc">Descending</mat-option>            
          </mat-select>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </div>

  <div >
    <app-battle-carousel [pokemonLineup]="pokemonBattleCards()"></app-battle-carousel>
  </div>
  
  
    <mat-paginator #paginator
               (page)="handlePageEvent($event)"
               [length]="totalItems()"
               [pageSize]="pageSize()"
               [pageIndex]="pageIndex()"
               [pageSizeOptions]="pageSizeOptions">

  </mat-paginator>



  <mat-card appearance="raised" style="color: gray; text-align: center; padding: 10px; margin-top: 15px;margin-bottom: 15px;">
    Data refreshes automatically based on tournament results
  </mat-card>
</div>
