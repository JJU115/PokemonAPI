<mat-card class="example-card" appearance="raised">
  <mat-card-header>
    <img mat-card-avatar class="avatar-image" [src]='spriteUrl'>
    <mat-card-title>{{pokemon.name | titlecase}}</mat-card-title>
    <mat-card-subtitle>{{pokemon.type | titlecase}}</mat-card-subtitle>
    <span>Trophy</span>  
  </mat-card-header>
  
  <mat-card-content>
    <span>#{{pokemon.id | number:'3.0-0'}}</span>


    <div>stats</div>
    
    
    
    <mat-progress-bar mode="determinate" [value]="winRate">Win Rate</mat-progress-bar>
  </mat-card-content>


  <mat-card-actions>
    <audio #audioPlayer [src]='battleCryUrl'></audio>
    <button mat-button (click)="audioPlayer.play()">Cry!</button>
  </mat-card-actions>
</mat-card>
